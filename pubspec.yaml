name: dollapp
description: "DollApp es tu herramienta para consultar tasas de cambio del Banco Central de Venezuela y otras monedas. Convierte divisas al instante, guarda tus favoritos y accede al historial de tasas pasadas. Todo con una interfaz clara, modo oscuro y funcionamiento offline."
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  sqflite: ^2.4.2+1
  path: ^1.9.1
  package_info_plus: ^10.1.0
  supabase_flutter: ^2.0.0
  dio: ^5.4.0
  open_file: ^4.0.0
  path_provider: ^2.0.16
  lottie: ^3.3.3
  android_intent_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/animation/